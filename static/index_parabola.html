<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Subway 3D Cockpit</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #050505; font-family: sans-serif; }
        #ui-container { position: absolute; top: 140px; left: 20px; color: #00ffcc; background: rgba(10,15,30,0.85); padding: 20px; border-radius: 8px; border: 1px solid #00ffcc; box-shadow: 0 0 15px rgba(0,255,204,0.3); min-width: 250px; z-index: 10; }
        h2 { margin: 0 0 10px 0; font-size: 18px; text-transform: uppercase; letter-spacing: 2px; }
        .telemetry-item { margin: 8px 0; font-size: 14px; font-family: monospace; }
        #pause-btn { margin-top: 15px; width: 100%; background: transparent; color: #00ffcc; border: 1px solid #00ffcc; padding: 10px; font-family: monospace; font-weight: bold; text-transform: uppercase; cursor: pointer; border-radius: 4px; transition: all 0.3s ease; box-shadow: 0 0 10px rgba(0,255,204,0.2); pointer-events: auto; }
        #pause-btn:hover { background: rgba(0,255,204,0.2); box-shadow: 0 0 20px rgba(0,255,204,0.5); }
        #danger-banner { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(255,0,0,0.85); color: white; padding: 15px 40px; font-size: 24px; font-weight: bold; border-radius: 4px; border: 2px solid white; box-shadow: 0 0 30px rgba(255,0,0,0.6); display: none; letter-spacing: 3px; animation: blink 1s infinite; z-index: 10; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
    <script src="/static/js/three.min.js"></script>
    <script src="/static/js/OrbitControls.min.js"></script>
</head>
<body>

<!-- 🛰️ СТИЛЬНАЯ HUD-ПЛАШКА ПРИБОРОВ МАШИНИСТА В УГЛУ ЭКРАНА -->
<div id="hud-telemetry" style="position: absolute; top: 20px; left: 20px; background: rgba(5,10,20,0.9); color: #00ffcc; padding: 15px; font-family: monospace; border-radius: 8px; border: 1px solid #00ffcc; z-index: 1000; min-width: 250px; box-shadow: 0 0 15px rgba(0,255,204,0.2);">
    <div style="font-weight: bold; border-bottom: 1px solid #00ffcc; padding-bottom: 5px; margin-bottom: 8px; letter-spacing: 1px;">🛰️ ТЕЛЕМЕТРИЯ АВТОПИЛОТА</div>
    <div style="font-size: 13px;">СКОРОСТЬ СОСТАВА: <span id="hud-train-speed" style="font-weight: bold; color: #fff; font-size: 15px;">0.0</span> км/ч</div>
    <div style="margin-top: 6px; font-size: 13px;">ДИНАМИКА ПРЕГРАДЫ: <span id="hud-obs-speed" style="font-weight: bold; color: #ffaa00; font-size: 13px;">0.0 (СТАТИЧНАЯ)</span></div>
</div>

<div id="ui-container">
    <h2>Subway AI Cockpit</h2>
    <hr style="border-color: #00ffcc;">
    <div class="telemetry-item">СВЯЗЬ: <span id="status" style="color: red;">ОТКЛЮЧЕНО</span></div>
    <div class="telemetry-item">СТАТУС ПУТИ: <span id="track-status" style="color: #00ffcc;">ЧИСТО</span></div>
    <div class="telemetry-item">ОБЪЕКТЫ НА ПУТЯХ: <span id="obj-count">0</span></div>
    <button id="pause-btn" onclick="togglePause()">II ПАУЗА СИСТЕМЫ</button>
</div>
<div id="danger-banner">!!! EMERGENCY BRAKE TRIPPED !!!</div>

<script>
const hudCanvas = document.createElement('canvas');
hudCanvas.width = 320; hudCanvas.height = 80;
const hudCtx = hudCanvas.getContext('2d');

let isPaused = false;
let needNextFrame = false; // Ключевой флаг Pull-модели: готовность к следующему кадру

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050505, 0.03);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.minDistance = 1; controls.maxDistance = 50;
camera.position.set(0, 1.6, 2);

const headlight = new THREE.PointLight(0xffffff, 2, 50);
headlight.position.set(0, 1.6, 1);
scene.add(headlight);
scene.add(new THREE.AmbientLight(0x111111));

const railMaterial = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.5 });
const tunnelMat = new THREE.MeshStandardMaterial({ color: 0x111111, wireframe: true });

let activeObstacles = [];
let currentTrackComponents = [];

function createBendingPath(coefficients, xOffset, yOffset) {
    const [a, b, c] = coefficients;
    const points = [];
    for (let z_abs = -5; z_abs <= 100; z_abs += 2) {
        const current_z = Math.max(0, z_abs);
        const z_scene = -z_abs;
        const x_scene = (a * Math.pow(current_z, 2)) + (b * current_z) + c + xOffset;
        points.push(new THREE.Vector3(x_scene, yOffset, z_scene));
    }
    return new THREE.CatmullRomCurve3(points);
}

const ws = new WebSocket("ws://127.0.0.1:8000/ws/monitoring");

ws.onopen = () => {
    document.getElementById("status").innerText = "ПОДКЛЮЧЕНО";
    document.getElementById("status").style.color = "#00ffcc";
    needNextFrame = true;
};

ws.onclose = () => {
    document.getElementById("status").innerText = "ОТКЛЮЧЕНО";
    document.getElementById("status").style.color = "red";
    needNextFrame = false;
};

function togglePause() {
    isPaused = !isPaused;
    const btn = document.getElementById("pause-btn");
    if (isPaused) {
        btn.innerText = "▶ ПРОДОЛЖИТЬ"; btn.style.color = "#ff3333"; btn.style.borderColor = "#ff3333";
        btn.style.boxShadow = "0 0 15px rgba(255, 51, 51, 0.4)";
    } else {
        btn.innerText = "II ПАУЗА СИСТЕМЫ"; btn.style.color = "#00ffcc"; btn.style.borderColor = "#00ffcc";
        btn.style.boxShadow = "0 0 10px rgba(0,255,204,0.2)";
        needNextFrame = true;
    }
}

ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    
    // Глубокая очистка старых препятствий и мешей
    activeObstacles.forEach(obj => scene.remove(obj));
    activeObstacles = [];
    currentTrackComponents.forEach(comp => {
        scene.remove(comp);
        if (comp.geometry) comp.geometry.dispose();
    });
    currentTrackComponents = [];

    // Извлекаем геометрию изгиба путей
    let trackCurve = data.track_curve || [0.0, 0.0, 0.0];
    if (trackCurve[0] === 0 && trackCurve[1] === 0 && trackCurve[2] === 0) {
        trackCurve = [0.0003, 0.0, 0.0]; 
    }
    
    const trackGauge = 0.75;
    const leftRailPath = createBendingPath(trackCurve, -trackGauge, 0.025);
    const rightRailPath = createBendingPath(trackCurve, trackGauge, 0.025);
    
    const leftRailGeom = new THREE.TubeGeometry(leftRailPath, 64, 0.05, 4, false);
    const rightRailGeom = new THREE.TubeGeometry(rightRailPath, 64, 0.05, 4, false);
    
    const leftRailMesh = new THREE.Mesh(leftRailGeom, railMaterial);
    const rightRailMesh = new THREE.Mesh(rightRailGeom, railMaterial);
    leftRailMesh.scale.set(1, 0.3, 1); rightRailMesh.scale.set(1, 0.3, 1);
    
    scene.add(leftRailMesh); scene.add(rightRailMesh);
    currentTrackComponents.push(leftRailMesh, rightRailMesh);
    
    const tunnelPath = createBendingPath(trackCurve, 0.0, 2.0);
    const tunnelGeometry = new THREE.TubeGeometry(tunnelPath, 32, 4.0, 16, false);
    const tunnelMesh = new THREE.Mesh(tunnelGeometry, tunnelMat);
    scene.add(tunnelMesh);
    currentTrackComponents.push(tunnelMesh);

    const banner = document.getElementById("danger-banner");
    const trackStatus = document.getElementById("track-status");
    const objCountSpan = document.getElementById("obj-count");
    
    // Сбрасываем приборы HUD-панели по умолчанию для каждого кадра
    document.getElementById("hud-train-speed").innerText = "18.0";
    document.getElementById("hud-obs-speed").innerText = "0.0 (СТАТИЧНАЯ)";
    document.getElementById("hud-obs-speed").style.color = "#00ffcc";

    // Исключаем маркеры-пустышки сокетного щита (class_id === -1) из общей статистики
    const realObjects = data.objects.filter(obj => obj.class_id !== -1);
    const hasDanger = realObjects.length > 0;

    if (hasDanger) {
        banner.style.display = "block"; 
        trackStatus.innerText = "ОПАСНОСТЬ"; 
        trackStatus.style.color = "red";
        scene.fog.color.setHex(0x330000);
    } else {
        banner.style.display = "none"; 
        trackStatus.innerText = "ЧИСТО"; 
        trackStatus.style.color = "#00ffcc";
        scene.fog.color.setHex(0x050505);
    }
    
    objCountSpan.innerText = realObjects.length;

    realObjects.forEach(obj => {
        const [width, height, depth] = obj.size_3d;
        const [cx, cy, cz] = obj.center;
        const distance = Math.abs(cz);
        const z_scene = -distance;
        const className = (obj.class_id === 1) ? "PERSON" : "OBSTACLE";
        
        objCountSpan.innerHTML = `${realObjects.length} <br><span style="color: #ff3333; font-size:12px;">[${className} | ${distance.toFixed(1)}м ]</span>`;
        
        const [a, b, c] = trackCurve;
        const correct_x = (a * Math.pow(distance, 2)) + (b * distance) + c;
        
        // Отрисовка 3D-коробки преграды в Three.js
        const boxGeom = new THREE.BoxGeometry(width, height, depth);
        const color = (obj.class_id === 1) ? 0xff0000 : 0xffaa00;
        const boxMat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.3 });
        const obstacleMesh = new THREE.Mesh(boxGeom, boxMat);
        obstacleMesh.position.set(correct_x, cy, z_scene);
        scene.add(obstacleMesh);
        activeObstacles.push(obstacleMesh);

        // --- 1. ОБНОВЛЕНИЕ ПАНЕЛИ ПРИБОРОВ HUD (СКОРОСТИ) ---
        if (obj.train_speed_kmh !== undefined) {
            document.getElementById("hud-train-speed").innerText = obj.train_speed_kmh.toFixed(1);
        }
        
        let speedText = "0.0 (СТАТИЧНАЯ)";
        if (obj.obstacle_speed_kmh !== undefined) {
            const obsSpeed = obj.obstacle_speed_kmh;
            if (Math.abs(obsSpeed) < 0.5) {
                speedText = "0.0 (СТАТИЧНАЯ)";
                document.getElementById("hud-obs-speed").style.color = "#00ffcc";
            } else {
                const direction = obsSpeed > 0 ? " НАВСТРЕЧУ" : " ОТ ПОЕЗДА";
                speedText = `${Math.abs(obsSpeed).toFixed(1)} км/ч (${direction})`;
                document.getElementById("hud-obs-speed").style.color = "#ff3333";
            }
            document.getElementById("hud-obs-speed").innerText = speedText;
        }

        // --- 2. ГЕНЕРАЦИЯ ДИНАМИЧЕСКОГО СЛОВЕСНОГО 3D-СПРАЙТА НАД ГОЛОВОЙ ОБЪЕКТА ---
        hudCtx.clearRect(0, 0, hudCanvas.width, hudCanvas.height);
        
        // Отрисовка подложки плашки
        hudCtx.fillStyle = 'rgba(10, 15, 30, 0.85)'; 
        hudCtx.fillRect(0, 0, hudCanvas.width, hudCanvas.height);
        
        // Бордюр рамки
        hudCtx.strokeStyle = (obj.class_id === 1) ? '#ff0000' : '#ffaa00'; 
        hudCtx.lineWidth = 4;
        hudCtx.strokeRect(0, 0, hudCanvas.width, hudCanvas.height);
        
        // Вывод текста телеметрии
        hudCtx.fillStyle = '#ffffff'; 
        hudCtx.font = 'bold 18px monospace'; 
        hudCtx.textAlign = 'center';
        hudCtx.fillText(`${className} | ${distance.toFixed(1)}m`, hudCanvas.width / 2, 32);
        
        hudCtx.fillStyle = (obj.class_id === 1) ? '#ff4444' : '#ffaa00';
        hudCtx.font = 'bold 14px monospace';
        hudCtx.fillText(`V: ${speedText}`, hudCanvas.width / 2, 58);
        
        const texture = new THREE.CanvasTexture(hudCanvas);
        const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
        const textSprite = new THREE.Sprite(spriteMaterial);
        
        // Масштабируем и выставляем плашку строго над кубиком
        textSprite.scale.set(3.5, 0.875, 1);
        textSprite.position.set(correct_x, cy + (height / 2) + 0.5, z_scene);
        
        scene.add(textSprite);
        activeObstacles.push(textSprite);
    });

    // Кадр полностью собран и отрисован в памяти — взводим флаг Pull-модели
    needNextFrame = true; 
};

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    camera.position.y += Math.sin(Date.now() * 0.005) * 0.0002;
    renderer.render(scene, camera);
    
    // ЖЕЛЕЗОБЕТОННАЯ СИНХРОНИЗАЦИЯ PULL-МОДЕЛИ:
    // Запрашиваем следующий кадр только если фронтенд полностью готов и система не на паузе
    if (needNextFrame && !isPaused && ws.readyState === WebSocket.OPEN) {
        needNextFrame = false; // Сразу сбрасываем флаг до получения нового ответа
        ws.send("READY_FOR_NEXT_FRAME");
    }
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Запуск бесконечного цикла визуализации кабины
animate();
</script>
</body>
</html>
